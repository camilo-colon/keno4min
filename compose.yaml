# Entorno local de pruebas.
#   docker compose up --build
#
# Usa las credenciales AWS de la máquina (~/.aws) y la configuración de .env.

x-common: &common
  env_file:
    - path: .env
      required: false
  environment:
    - AWS_PROFILE
    - AWS_CONFIG_FILE=/home/nonroot/.aws/config
    - AWS_SHARED_CREDENTIALS_FILE=/home/nonroot/.aws/credentials
  volumes:
    - ~/.aws:/home/nonroot/.aws:ro

services:
  api:
    <<: *common
    build:
      context: .
      target: api
    image: keno4min-api:local
    ports:
      - "8080:8080"

  worker:
    <<: *common
    build:
      context: .
      target: worker
    image: keno4min-worker:local
