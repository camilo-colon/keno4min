openapi: 3.1.2

info:
  title: Keno4min Internal API
  version: 0.1.0
  description: HTTP contract for version 1 of the internal service API.

servers:
  - url: /v1
    description: Internal API version 1

paths: {}

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Required unique key that makes a non-idempotent request retryable.
      schema:
        type: string
        minLength: 1
        maxLength: 255

  responses:
    Problem:
      description: The request could not be processed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    ValidationError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        field:
          type: string
          description: Request field associated with the validation error.
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stable machine-readable validation error code.
        message:
          type: string
          description: Human-readable description of the validation error.

    ProblemDetails:
      type: object
      description: Problem Details response as defined by RFC 9457.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference that identifies the problem type.
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code generated for this occurrence.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference that identifies this occurrence.
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          description: Stable machine-readable application error code.
        requestId:
          type: string
          description: Correlation identifier for the request.
        errors:
          type: array
          description: Structured validation errors when applicable.
          items:
            $ref: "#/components/schemas/ValidationError"
